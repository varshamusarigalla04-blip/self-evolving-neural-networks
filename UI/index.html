    // =========================================================================
    // MAIN REACT DASHBOARD APPLICATION
    // =========================================================================
    function App() {
      // Core Reactive State
      const [currentArch, setCurrentArch] = useState(AppState.currentArch);
      const [metrics, setMetrics] = useState(AppState.metrics);
      const [generation, setGeneration] = useState(AppState.generation);
      const [totalMutations, setTotalMutations] = useState(AppState.totalMutations);
      const [bestScore, setBestScore] = useState(AppState.bestPerformanceScore);
      const [evolutionStatus, setEvolutionStatus] = useState(AppState.evolutionStatus);
      const [activeStep, setActiveStep] = useState(AppState.activeWorkflowStep);
      const [latestDecision, setLatestDecision] = useState(AppState.latestDecision);
      const [agentLogs, setAgentLogs] = useState([...AppState.agentLogs]);
      
      // Detailed Evolution History & Decision records
      const [historyDecisions, setHistoryDecisions] = useState([
        {
          generation: '01',
          archChange: 'Baseline (4 → 4 → 4 → 2)',
          performance: '72.0%',
          mutation: 'Initial Baseline Setup',
          reason: 'Initial model benchmarked. Accuracy below 85% target threshold.',
          decision: 'Mutate', // 'Keep' | 'Mutate' | 'Reject'
          improvement: 'Baseline',
          timestamp: new Date().toLocaleTimeString()
        }
      ]);

      // Controls State
      const [isProcessing, setIsProcessing] = useState(false);
      const [isAutoRunning, setIsAutoRunning] = useState(false);
      const [speedMs, setSpeedMs] = useState(AppState.config.speedMs);
      const [targetFitness, setTargetFitness] = useState(AppState.config.performanceThreshold);
      const [animRunning, setAnimRunning] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);

      // Model Filter Checkboxes
      const [selectedModels, setSelectedModels] = useState(new Set(AI_MODELS_LIST.map(m => m.id)));
      const [selectedMetric, setSelectedMetric] = useState('Reasoning');

      // Engine References
      const visualizerRef = useRef(null);
      const analyticsRef = useRef(null);
      const autoRunTimerRef = useRef(null);
      const prevPerfScoreRef = useRef(72.0);

      // --- Initialize Canvas Engines on Mount ---
      useEffect(() => {
        if (!visualizerRef.current) {
          visualizerRef.current = new NetworkVisualizer('networkCanvas');
        }
        if (!analyticsRef.current) {
          analyticsRef.current = new ModelVariationAnalytics();
        }

        // Subscribe to AppState notifications
        AppState.subscribe((event, payload) => {
          setMetrics({ ...AppState.metrics });
          setGeneration(AppState.generation);
          setTotalMutations(AppState.totalMutations);
          setBestScore(AppState.bestPerformanceScore);
          setEvolutionStatus(AppState.evolutionStatus);
          setCurrentArch({ ...AppState.currentArch });
          setLatestDecision({ ...AppState.latestDecision });
          setAgentLogs([...AppState.agentLogs]);
          setActiveStep(AppState.activeWorkflowStep);

          if (event === 'candidateGenerated' || event === 'cycleCompleted' || event === 'stateReset') {
            if (visualizerRef.current) {
              visualizerRef.current.rebuildGraph();
              visualizerRef.current.startAnimation(10000);
            }
          }
        });

        const handleFullscreenChange = () => {
          setIsFullscreen(Boolean(document.fullscreenElement));
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);

        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          if (autoRunTimerRef.current) clearTimeout(autoRunTimerRef.current);
        };
      }, []);

      // Fullscreen Toggle
      const toggleFullscreen = useCallback(() => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.warn("Fullscreen request error:", err);
          });
        } else {
          document.exitFullscreen().catch(err => {
            console.warn("Exit fullscreen error:", err);
          });
        }
      }, []);

      // Helper to compute improvement and decision state
      const recordEvolutionDecision = (prevScore, newScore, mutationName, newArchStr, reasonStr) => {
        const delta = parseFloat((newScore - prevScore).toFixed(1));
        const genStr = AppState.generation < 10 ? `0${AppState.generation}` : `${AppState.generation}`;
        let decisionType = 'Keep';
        let improvementStr = delta > 0 ? `+${delta}%` : `${delta}%`;

        if (delta > 0) {
          decisionType = 'Keep';
        } else if (delta < 0) {
          decisionType = 'Reject';
        } else {
          decisionType = 'Mutate';
          improvementStr = '0.0%';
        }

        const newEntry = {
          generation: genStr,
          archChange: newArchStr,
          performance: `${newScore.toFixed(1)}%`,
          mutation: mutationName,
          reason: reasonStr || 'Evaluated candidate performance against baseline threshold.',
          decision: decisionType,
          improvement: improvementStr,
          timestamp: new Date().toLocaleTimeString()
        };

        setHistoryDecisions(prev => [newEntry, ...prev]);
        prevPerfScoreRef.current = newScore;
      };

      // --- Evolution Execution Handlers ---
      const handleRunEvolution = async () => {
        if (EvolutionEngine.isProcessingStep || isProcessing) return;
        if (isAutoRunning) handleStopAutoRun();

        setIsProcessing(true);
        const prevScore = AppState.metrics.performanceScore;
        try {
          await EvolutionEngine.executeEvolutionCycle();
          const newScore = AppState.metrics.performanceScore;
          const mutationName = AppState.latestDecision.selectedMutation || 'Autonomous Mutation';
          const newArchStr = AppState.latestDecision.newArchitecture || 'Input → Hidden → Output';
          const reasonStr = AppState.latestDecision.reason || 'Autonomous agent evaluation.';
          recordEvolutionDecision(prevScore, newScore, mutationName, newArchStr, reasonStr);
        } finally {
          setIsProcessing(false);
        }
      };

      const handleToggleAutoRun = () => {
        if (isAutoRunning) {
          handleStopAutoRun();
        } else {
          setIsAutoRunning(true);
          AppState.config.autoRunning = true;
          runAutoEvolutionLoop();
        }
      };

      const handleStopAutoRun = () => {
        setIsAutoRunning(false);
        AppState.config.autoRunning = false;
        if (autoRunTimerRef.current) {
          clearTimeout(autoRunTimerRef.current);
          autoRunTimerRef.current = null;
        }
      };

      const runAutoEvolutionLoop = async () => {
        if (!AppState.config.autoRunning) return;
        if (AppState.metrics.performanceScore >= AppState.config.performanceThreshold) {
          handleStopAutoRun();
          return;
        }

        setIsProcessing(true);
        const prevScore = AppState.metrics.performanceScore;
        await EvolutionEngine.executeEvolutionCycle();
        const newScore = AppState.metrics.performanceScore;
        const mutationName = AppState.latestDecision.selectedMutation || 'Autonomous Mutation';
        const newArchStr = AppState.latestDecision.newArchitecture || 'Input → Hidden → Output';
        const reasonStr = AppState.latestDecision.reason;
        recordEvolutionDecision(prevScore, newScore, mutationName, newArchStr, reasonStr);
        setIsProcessing(false);

        if (AppState.config.autoRunning && AppState.metrics.performanceScore < AppState.config.performanceThreshold) {
          autoRunTimerRef.current = setTimeout(runAutoEvolutionLoop, AppState.config.speedMs);
        } else {
          handleStopAutoRun();
        }
      };

      const handleReset = () => {
        handleStopAutoRun();
        AppState.resetToInitial();
        prevPerfScoreRef.current = 72.0;
        setHistoryDecisions([
          {
            generation: '01',
            archChange: 'Baseline (4 → 4 → 4 → 2)',
            performance: '72.0%',
            mutation: 'Initial Baseline Setup',
            reason: 'System reset to default baseline topology.',
            decision: 'Mutate',
            improvement: 'Baseline',
            timestamp: new Date().toLocaleTimeString()
          }
        ]);
        if (visualizerRef.current) {
          visualizerRef.current.rebuildGraph();
          visualizerRef.current.startAnimation(10000);
        }
      };

      const handleManualMutation = async (type) => {
        if (EvolutionEngine.isProcessingStep || isProcessing) return;
        if (isAutoRunning) handleStopAutoRun();

        setIsProcessing(true);
        const prevScore = AppState.metrics.performanceScore;
        try {
          await EvolutionEngine.executeEvolutionCycle({ type, layerIndex: 0 });
          const newScore = AppState.metrics.performanceScore;
          const mutationName = type === 'ADD_NEURON' ? '+ Add Neuron' :
                               type === 'REMOVE_NEURON' ? '− Remove Neuron' :
                               type === 'ADD_LAYER' ? '+ Add Hidden Layer' : '− Remove Hidden Layer';
          const newArchStr = AppState.latestDecision.newArchitecture || 'Input → Hidden → Output';
          const reasonStr = `Manual operator applied: ${mutationName}`;
          recordEvolutionDecision(prevScore, newScore, mutationName, newArchStr, reasonStr);
        } finally {
          setIsProcessing(false);
        }
      };

      const handleSpeedChange = (e) => {
        const val = parseInt(e.target.value, 10);
        setSpeedMs(val);
        AppState.config.speedMs = val;
      };

      const handleTargetChange = (e) => {
        const val = parseInt(e.target.value, 10);
        setTargetFitness(val);
        AppState.config.performanceThreshold = val;
      };

      const handleReplayAnimation = () => {
        if (visualizerRef.current) {
          visualizerRef.current.replayAnimation();
          setAnimRunning(true);
        }
      };

      // Model Filter Checkbox Handlers
      const toggleModel = (modelId) => {
        const next = new Set(selectedModels);
        if (next.has(modelId)) next.delete(modelId);
        else next.add(modelId);
        setSelectedModels(next);
        if (analyticsRef.current) {
          analyticsRef.current.toggleModel(modelId, next.has(modelId));
        }
      };

      const selectAllModels = () => {
        const all = new Set(AI_MODELS_LIST.map(m => m.id));
        setSelectedModels(all);
        if (analyticsRef.current) analyticsRef.current.setAllModels(true);
      };

      const deselectAllModels = () => {
        const empty = new Set();
        setSelectedModels(empty);
        if (analyticsRef.current) analyticsRef.current.setAllModels(false);
      };

      const handleMetricSelect = (e) => {
        const m = e.target.value;
        setSelectedMetric(m);
        if (analyticsRef.current) analyticsRef.current.setMetric(m);
      };

      // Presets
      const handleLoadPreset = (scenario) => {
        handleStopAutoRun();
        if (scenario === 'underfitting') {

            accuracy: 92.0,

                          <th>Mutation Performed</th>
                          <th>Reason for Mutation</th>
                          <th style={{ minWidth: '130px' }}>Decision</th>
                          <th>Improvement</th>
                          <th>Time</th>
                        </tr>
                      </thead>
                      <tbody>
                        {historyDecisions.map((row, idx) => {
                          let badgeClass = 'initial';
                          let icon = '●';
                          if (row.decision === 'Keep') {
                            badgeClass = 'keep';
                            icon = '✓';
                          } else if (row.decision === 'Mutate') {
                            badgeClass = 'mutate';
                            icon = '⚡';
                          } else if (row.decision === 'Reject') {
                            badgeClass = 'reject';
                            icon = '✗';
                          }

                          return (
                            <tr key={idx}>
                              <td className="col-gen">Gen {row.generation}</td>
                              <td className="col-arch" style={{ fontSize: '0.82rem' }}>{row.archChange}</td>
                              <td style={{ color: 'var(--accent-cyan-light)', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>
                                {row.performance}
                              </td>
                              <td style={{ color: '#fff', fontWeight: 600 }}>{row.mutation}</td>
                              <td style={{ color: 'var(--text-secondary)', fontSize: '0.8rem', maxWidth: '320px' }}>
                                {row.reason}
                              </td>
                              {/* VISUALLY CLEAR DECISION: Keep / Mutate / Reject */}
                              <td>
                                <span className={`badge-decision ${badgeClass}`}>
                                  <span>{icon}</span>
                                  <span>{row.decision}</span>
                                </span>
                              </td>
                              <td style={{ 
                                fontWeight: 700, 
                                fontFamily: 'var(--font-mono)',
                                color: row.improvement.startsWith('+') ? 'var(--accent-emerald-light)' : row.improvement.startsWith('-') ? 'var(--accent-rose)' : 'var(--text-secondary)'
                              }}>
                                {row.improvement}
                              </td>
                              <td style={{ color: 'var(--text-muted)', fontSize: '0.76rem' }}>
                                {row.timestamp}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </section>

                {/* 4.4. EVOLUTION PIPELINE (7 CONNECTED STAGES) */}
                <section id="evolution" className="card">
                  <div className="card-header">
                    <div className="card-title-wrap">
                      <span className="card-icon">⚡</span>
                      <div>
                        <h2 className="card-title">Autonomous Evolution Cycle Pipeline</h2>
                        <div className="card-subtitle">Sense-think-act architecture evolution loop</div>
                      </div>
                    </div>
                  </div>

                  <div className="pipeline-track">
                    {[
                      { step: 1, name: 'Evaluate Performance' },
                      { step: 2, name: 'Detect Performance Issue' },
                      { step: 3, name: 'Select Mutation' },
                      { step: 4, name: 'Generate New Architecture' },
                      { step: 5, name: 'Evaluate New Architecture' },
                      { step: 6, name: 'Compare Performance' },
                      { step: 7, name: 'Accept / Reject' }
                    ].map((st, idx) => (
                      <React.Fragment key={st.step}>
                        <div 
                          id={`pipe-step-${st.step}`} 
                          className={`pipeline-stage-box ${activeStep === st.step ? 'active-stage' : ''}`}
                        >
                          <span className="stage-number">{st.step < 10 ? `0${st.step}` : st.step}</span>
                          <span className="stage-name">{st.name}</span>
                        </div>
                        {idx < 6 && <span className="pipeline-connector">➔</span>}
                      </React.Fragment>
                    ))}
                  </div>
                </section>

              </div>

              {/* RIGHT SIDEBAR COLUMN: QUICK TELEMETRY, DECISION PANEL, PRESETS */}
              <div className="sidebar-column">

                {/* Quick Telemetry Card */}
                <div className="sidebar-widget">
                  <div className="widget-title">
                    <span>⚡</span> System Telemetry
                  </div>

                  <div className="quick-status-list">
                    <div className="quick-status-row">
                      <span className="quick-label">System State</span>
                      <span className="quick-val" style={{ color: evolutionStatus === 'REJECTED' ? 'var(--accent-rose)' : 'var(--accent-emerald)' }}>
                        ● {evolutionStatus}
                      </span>
                    </div>
                    <div className="quick-status-row">
                      <span className="quick-label">Active Generation</span>
                      <span className="quick-val">{generation < 10 ? `0${generation}` : generation}</span>
                    </div>
                    <div className="quick-status-row">
                      <span className="quick-label">Total Mutations</span>
                      <span className="quick-val" style={{ color: 'var(--accent-purple)' }}>
                        {totalMutations < 10 ? `0${totalMutations}` : totalMutations}
                      </span>
                    </div>
                    <div className="quick-status-row">
                      <span className="quick-label">Peak Performance</span>
                      <span className="quick-val" style={{ color: 'var(--accent-cyan-light)' }}>
                        {bestScore.toFixed(1)}%
                      </span>
                    </div>
                    <div className="quick-status-row">
                      <span className="quick-label">Neuron Animation</span>
                      <span className="quick-val" style={{ color: 'var(--text-secondary)' }}>
                        {animRunning ? 'Running' : 'Paused'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* 4.5. AGENT DECISION PANEL */}
                <section id="decision" className="sidebar-widget agent-decision-panel">
                  <div className="widget-title">
                    <span>🧠</span> Real-Time Agent Decision
                  </div>

                  <div className="decision-display-card">
                    <div className="decision-field-box">
                      <span className="decision-field-label">Current Performance</span>
                      <span className="decision-field-val">{latestDecision.currentPerformance}</span>
                    </div>

                    <div className="decision-field-box">
                      <span className="decision-field-label">Detected Issue</span>
                      <span className="decision-field-val" style={{ fontSize: '0.82rem', color: '#fde68a' }}>
                        {latestDecision.detectedIssue}
                      </span>
                    </div>

                    <div className="decision-field-box">
                      <span className="decision-field-label">Selected Mutation</span>
                      <span className="decision-field-val" style={{ color: 'var(--accent-cyan-light)' }}>
                        {latestDecision.selectedMutation}
                      </span>
                    </div>

                    <div className="decision-field-box">
                      <span className="decision-field-label">Candidate Architecture</span>
                      <span className="decision-field-val" style={{ fontSize: '0.85rem' }}>
                        {latestDecision.newArchitecture}
                      </span>
                    </div>

                    <div className="decision-field-box">
                      <span className="decision-field-label">Candidate Performance</span>
                      <span className="decision-field-val">{latestDecision.newPerformance}</span>
                    </div>

                    <div className="decision-field-box">
                      <span className="decision-field-label">Decision</span>
                      <span className={`decision-badge-pill ${latestDecision.finalDecision.includes('ACCEPTED') || latestDecision.finalDecision.includes('Keep') ? 'accepted' : latestDecision.finalDecision.includes('REJECTED') || latestDecision.finalDecision.includes('Reject') ? 'rejected' : 'ready'}`}>
                        {latestDecision.finalDecision.includes('ACCEPTED') || latestDecision.finalDecision.includes('Keep') ? '✓ KEEP CANDIDATE' : 
                         latestDecision.finalDecision.includes('REJECTED') || latestDecision.finalDecision.includes('Reject') ? '✗ REJECT CANDIDATE' : 
                         latestDecision.finalDecision}
                      </span>
                    </div>

                    <div className="decision-reason-box">
                      <strong style={{ color: 'var(--accent-cyan)', fontSize: '0.76rem', textTransform: 'uppercase', display: 'block', marginBottom: '2px' }}>
                        Agent Reasoning:
                      </strong>
                      <span>“{latestDecision.reason}”</span>
                    </div>
                  </div>

                  {/* Agent Diagnostic Thought Stream */}
                  <div>
                    <span style={{ fontSize: '0.74rem', textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-secondary)', fontWeight: 700 }}>
                      Agent Thought Stream
                    </span>
                    <div id="agentDecisionLogs" className="logs-container">
                      {agentLogs.length === 0 ? (
                        <div style={{ color: 'var(--text-muted)', fontSize: '0.8rem', padding: '8px' }}>
                          Awaiting diagnostic thoughts...
                        </div>
                      ) : (
                        agentLogs.slice().reverse().map((log, idx) => (
                          <div key={idx} className={`log-item type-${log.type}`}>
                            <div className="log-item-header">
                              <span className="log-item-stage">{log.stage} • {log.title}</span>
                              <span style={{ opacity: 0.7 }}>{log.timestamp}</span>
                            </div>
                            <div className="log-item-msg">{log.message}</div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </section>

                {/* Presentation Scenarios */}
                <div className="sidebar-widget">
                  <div className="widget-title">
                    <span>🎯</span> Presentation Presets
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    <button 
                      className="btn btn-secondary" 
                      onClick={() => handleLoadPreset('balanced')}
                      style={{ width: '100%', justifyContent: 'flex-start', fontSize: '0.8rem', padding: '8px 12px' }}
                    >
                      <span>● Baseline Setup (72%)</span>
                    </button>
                    <button 
                      className="btn btn-secondary" 
                      onClick={() => handleLoadPreset('underfitting')}
                      style={{ width: '100%', justifyContent: 'flex-start', fontSize: '0.8rem', padding: '8px 12px' }}
                    >
                      <span>● Underfitting Demo (48%)</span>
                    </button>
                    <button 
                      className="btn btn-secondary" 
                      onClick={() => handleLoadPreset('bloat')}
                      style={{ width: '100%', justifyContent: 'flex-start', fontSize: '0.8rem', padding: '8px 12px' }}
                    >
                      <span>● Bloat / Pruning Demo (88%)</span>
                    </button>
                  </div>
                </div>

              </div>

            </div>

            {/* ================================================================= */}
            {/* 5. AI MODEL PERFORMANCE & VARIATION ANALYSIS (ML DASHBOARD)       */}
            {/* ================================================================= */}
            <section id="model-comparison" className="card">
              <div className="comparison-card-header">
                <div className="card-title-wrap">
                  <span className="card-icon">📈</span>
                  <div>
                    <h2 className="card-title">AI Model Performance &amp; Variation Analysis</h2>
                    <div className="card-subtitle">
                      Comparative multi-model benchmark variation across evaluation metrics and evolutionary generations
                    </div>
                  </div>
                </div>

                <div className="prototype-disclaimer-pill" style={{ borderColor: 'rgba(245, 158, 11, 0.4)', color: '#fde68a' }}>
                  <span>⚠️</span> Simulated ML Experiment Analytics
                </div>
              </div>

              {/* DEDICATED NVIDIA NEMOTRON SPOTLIGHT BANNER */}
              <div className="nemotron-spotlight-bar">
                <div className="nemotron-spotlight-left">
                  <div className="nemotron-icon-chip">
                    <NvidiaNemotronLogo size={22} color="#000" />
                  </div>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <strong style={{ color: '#fff', fontSize: '1rem', letterSpacing: '-0.01em' }}>NVIDIA Nemotron</strong>
                      <span className="nemotron-badge">Enterprise Reasoning &amp; Agentic AI</span>
                    </div>
                    <div style={{ color: 'var(--text-secondary)', fontSize: '0.8rem', marginTop: '2px' }}>
                      High-throughput enterprise reasoning architecture • Peak Benchmark: <strong style={{ color: '#76b900' }}>88.2%</strong> • Speed Score: <strong style={{ color: '#76b900' }}>89.4</strong> • Reasoning Score: <strong style={{ color: '#76b900' }}>85.8</strong>
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                  <span style={{ fontSize: '0.74rem', color: '#76b900', background: 'rgba(118, 185, 0, 0.15)', padding: '5px 12px', borderRadius: '20px', border: '1px solid rgba(118, 185, 0, 0.4)', fontWeight: 700 }}>
                    Active Evaluation Target
                  </span>
                </div>
              </div>

              {/* 4 Summary Analytics Metric Cards */}
              <div className="analytics-summary-grid">
                <div className="analytics-summary-card top-stat">
                  <div className="summary-card-label">Best Demo Performance</div>
                  <div id="summaryBestPerfVal" className="summary-card-val" style={{ color: 'var(--accent-emerald-light)' }}>95.1%</div>
                  <div id="summaryBestPerfModel" className="summary-card-sub">Claude (Peak Demo)</div>
                </div>

                <div className="analytics-summary-card avg-stat">
                  <div className="summary-card-label">Average Performance</div>
                  <div id="summaryAvgPerfVal" className="summary-card-val" style={{ color: 'var(--accent-cyan-light)' }}>87.6%</div>
                  <div className="summary-card-sub">Active cohort mean</div>
                </div>

                <div className="analytics-summary-card var-stat">
                  <div className="summary-card-label">Highest Variation</div>
                  <div id="summaryHighestVarVal" className="summary-card-val" style={{ color: 'var(--accent-amber)' }}>±5.2%</div>
                  <div id="summaryHighestVarModel" className="summary-card-sub">OX Alpha (Max Spread)</div>
                </div>

                <div className="analytics-summary-card count-stat">
                  <div className="summary-card-label">Models Compared</div>
                  <div id="summaryModelsCountVal" className="summary-card-val" style={{ color: 'var(--accent-purple)' }}>
                    {selectedModels.size} / {AI_MODELS_LIST.length}
                  </div>
                  <div className="summary-card-sub">Filterable cohort</div>
                </div>
              </div>

              {/* MAIN GRAPH 1: Multi-Line Performance Variation */}
              <div className="analytics-graph-card main-graph-card">
                <div className="graph-card-header">
                  <div>
                    <h3 className="graph-card-title">Multi-Line Performance Variation Across Evaluations</h3>
                    <div className="graph-card-subtitle">Smooth cubic curves showing model variance across 8 sequential evaluation iterations</div>
                  </div>
                  <span className="graph-tag">Main Variation Graph</span>
                </div>

                {/* Interactive Model Legend Chips */}
                <div className="graph-model-legend-bar">
                  <span className="legend-bar-title">Models:</span>
                  {AI_MODELS_LIST.map(m => (
                    <span 
                      key={m.id} 
                      className={`graph-legend-chip ${selectedModels.has(m.id) ? 'active' : 'inactive'}`}
                      style={{ '--chip-color': m.color }}
                      onClick={() => toggleModel(m.id)}
                      title={`Click to filter ${m.name}`}
                    >
                      <span className="legend-chip-dot" style={{ background: m.color }}></span>
                      <span className="legend-chip-name">{m.name}</span>
                    </span>
                  ))}
                </div>

                <div className="analytics-canvas-wrapper">
                  <canvas id="mainVariationCanvas" height="460"></canvas>
                  <div id="mainVariationTooltip" className="analytics-tooltip" style={{ display: 'none' }}></div>
                </div>

                <div className="analytics-graph-footer-legend">
                  <span className="legend-hint">Hover anywhere on the graph to inspect multi-model crosshair values</span>
                </div>
              </div>

              {/* SECONDARY 2-COLUMN GRAPHS GRID */}
              <div className="analytics-dual-grid">

                {/* SECOND GRAPH: Metric-wise Model Variation */}
                <div className="analytics-graph-card">
                  <div className="graph-card-header">
                    <div>
                      <h3 className="graph-card-title">Metric-wise Model Variation</h3>
                      <div className="graph-card-subtitle">Ranked model performance for selected benchmark category</div>
                    </div>

                    <div className="control-widget" style={{ marginLeft: 'auto' }}>
                      <label htmlFor="metricSelectDropdown" style={{ fontSize: '0.78rem' }}>Select Metric:</label>
                      <select 
                        id="metricSelectDropdown" 
                        className="styled-select"
                        value={selectedMetric}
                        onChange={handleMetricSelect}
                      >
                        <option value="Reasoning">Reasoning</option>
                        <option value="Coding">Coding</option>
                        <option value="Language">Language</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Knowledge">Knowledge</option>
                        <option value="Speed">Speed</option>
                      </select>
                    </div>
                  </div>

                  <div className="analytics-canvas-wrapper">
                    <canvas id="metricVariationCanvas" height="380"></canvas>
                    <div id="metricVariationTooltip" className="analytics-tooltip" style={{ display: 'none' }}></div>
                  </div>
                </div>

                {/* THIRD GRAPH: Generational Trajectory */}
                <div className="analytics-graph-card">
                  <div className="graph-card-header">
                    <div>
                      <h3 className="graph-card-title">Performance Variation Across Generations</h3>
                      <div className="graph-card-subtitle">Trajectory tracking across 8 evolutionary generational epochs (Gen 1 to Gen 8)</div>
                    </div>
                    <span className="graph-tag">Generations 1–8</span>
                  </div>

                  {/* Interactive Model Legend Chips */}
                  <div className="graph-model-legend-bar">
                    <span className="legend-bar-title">Generational Curves:</span>
                    {AI_MODELS_LIST.map(m => (
                      <span 
                        key={m.id} 
                        className={`graph-legend-chip ${selectedModels.has(m.id) ? 'active' : 'inactive'}`}
                        style={{ '--chip-color': m.color }}
                        onClick={() => toggleModel(m.id)}
                        title={`Click to filter ${m.name}`}
                      >
                        <span className="legend-chip-dot" style={{ background: m.color }}></span>
                        <span className="legend-chip-name">{m.name}</span>
                      </span>
                    ))}
                  </div>

                  <div className="analytics-canvas-wrapper">
                    <canvas id="generationVariationCanvas" height="380"></canvas>
                    <div id="generationVariationTooltip" className="analytics-tooltip" style={{ display: 'none' }}></div>
                  </div>
                </div>

              </div>

              <div className="comparison-footnote">
                <span>*</span> Performance values are illustrative and may vary depending on model version, task, benchmark and evaluation method. Values shown are simulated demonstration metrics for college project presentation purposes.
              </div>
            </section>

            {/* ================================================================= */}
            {/* 6. VIVA DEFENSE GUIDE & PROJECT IDENTITY                          */}
            {/* ================================================================= */}
            <section className="card">
              <div className="card-header">
                <div className="card-title-wrap">
                  <span className="card-icon">🎓</span>
                  <div>
                    <h2 className="card-title">Viva Defense &amp; Project Evaluation Guide</h2>
                    <div className="card-subtitle">How this autonomous agentic system functions</div>
                  </div>
                </div>
              </div>

              <div className="viva-grid">
                <div className="viva-card">
                  <h5>1. Performance Evaluation</h5>
                  <p>The system evaluates current neural-network accuracy, loss, and latency, computing an objective performance score to determine if improvements are required.</p>
                </div>
                <div className="viva-card">
                  <h5>2. Performance-Driven Mutation</h5>
                  <p>When accuracy falls below the target threshold or latency bloat is detected, the agent autonomously generates topology mutations (adding or pruning neurons/layers).</p>
                </div>
                <div className="viva-card">
                  <h5>3. Keep / Mutate / Reject Decision</h5>
                  <p>Candidate architectures are benchmarked. If the new architecture outperforms the baseline, the decision is <strong>Keep</strong>. If degraded, it is <strong>Reject</strong> and the baseline is retained.</p>
                </div>
              </div>
            </section>

          </main>

          {/* ================================================================= */}
          {/* 7. APP FOOTER                                                     */}
          {/* ================================================================= */}
          <footer className="app-footer">
            <p>Self-Evolving Neural Networks Using Performance-Driven Architecture Mutation &bull; Agentic AI Project Dashboard</p>
          </footer>

        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
